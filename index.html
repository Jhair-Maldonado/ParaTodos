<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>E-Commerce Accesible</title>
  </head>
  <body>
    <!-- SVG Filters for Color Blindness Correction (Daltonization approximation) -->
    <svg width="0" height="0" style="position: absolute; pointer-events: none; z-index: -1;" aria-hidden="true">
      <defs>
        <!-- Protanopia Filter -->
        <filter id="protanopia-filter">
          <feColorMatrix type="matrix" values="
            0.622, 0.377, 0, 0, 0
            0.264, 0.732, 0, 0, 0
            0.216, 0.110, 0.673, 0, 0
            0, 0, 0, 1, 0" />
        </filter>
        <!-- Deuteranopia Filter -->
        <filter id="deuteranopia-filter">
          <feColorMatrix type="matrix" values="
            0.288, 0.711, 0, 0, 0
            0.052, 0.947, 0, 0, 0
            -0.257, 0.257, 1.000, 0, 0
            0, 0, 0, 1, 0" />
        </filter>
        <!-- Tritanopia Filter -->
        <filter id="tritanopia-filter">
          <feColorMatrix type="matrix" values="
            1.000, 0.057, -0.057, 0, 0
            0, 0.936, 0.064, 0, 0
            0, 0.525, 0.474, 0, 0
            0, 0, 0, 1, 0" />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
